<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Week05 NPO</title>
</head>

<body>
  <header class="bg-white shadow px-6 py-4">
      <div class="max-w-4xl mx-auto flex flex-col md:flex-row md:items-center md:justify-between gap-2">
        <h1 class="text-xl font-bold text-gray-600">🌻ひまわり会🌻</h1>
        <nav class="flex flex-col md:flex-row gap-2 md:gap-6 text-sm">
          <a href="#" class="text-gray-400 hover:text-gray-700">ホーム</a>
          <a href="#" class="text-gray-400 hover:text-gray-700">活動内容</a>
          <a href="#" class="text-gray-400 hover:text-gray-700">お問い合わせ</a>
        </nav>
      </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-10">
      <section class="mb-10 text-center">
        <h2 class="text-2xl font-bold text-gray-800 mb-8">子どもたちと一緒に成長しよう！</h2>
      </section>

      <section class="mb-10">
        <h2 class="text-xl font-bold mb-4">【 活動内容 】</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="bg-white rounded-lg shadow p-4 border border-amber-300 hover:shadow-lg transition">
            <p class="text-2xl mb-2">📖</p>
            <h3 class="font-bold">絵本の読み聞かせ</h3>
            <p class="text-gray-500 text-sm mt-1">月2回、地域の図書館で子ども向けに絵本の読み聞かせを行っています。</p>
          </div>
          <div class="bg-white rounded-lg shadow p-4 border border-amber-300 hover:shadow-lg transition">
            <p class="text-2xl mb-2">🏫</p>
            <h3 class="font-bold">地域の小学生との交流</h3>
            <p class="text-gray-500 text-sm mt-1">地元の小学校の学童で子供たちと様々な遊びをしたり宿題を教えたりしています。</p>
          </div>
          <div class="bg-white rounded-lg shadow p-4 border border-amber-300 hover:shadow-lg transition">
            <p class="text-2xl mb-2">🌻</p>
            <h3 class="font-bold">定例会</h3>
            <p class="text-gray-500 text-sm mt-1">毎週水曜５限に定例会を行い、今後の方針について意見交換をしています。</p>
          </div>
        </div>
      </section>
    </main>

    <footer class="bg-amber-300 text-gray-700 text-sm text-center py-6">
      2026 ひまわり会
    </footer>

  </body>
</html>
